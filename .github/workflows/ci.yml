name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-selftest.txt
      - name: Compile sources
        run: python -m py_compile phone_voice_win_input.py phone_voice_gui.py phone_voice_gui_entry.py qr_util.py
      - name: Install self-test dependencies
        run: python -m pip install -r requirements-selftest.txt
      - name: Run self-test
        shell: pwsh
        run: .\.github\scripts\run-self-test.ps1