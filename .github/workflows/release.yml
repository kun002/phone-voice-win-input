name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-gui.txt
            requirements-selftest.txt
            requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-gui.txt -r requirements-build.txt

      - name: Run self-test
        shell: pwsh
        run: .\.github\scripts\run-self-test.ps1

      - name: Build Windows executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name PhoneVoiceWinInput
          --hidden-import phone_voice_gui
          phone_voice_gui_entry.py

      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\PhoneVoiceWinInput.exe release\PhoneVoiceWinInput.exe
          Copy-Item README.md, LICENSE, SECURITY.md release\
          Compress-Archive -Path release\PhoneVoiceWinInput.exe, release\README.md, release\LICENSE, release\SECURITY.md -DestinationPath release\PhoneVoiceWinInput-Windows-x64.zip
          $hash = (Get-FileHash release\PhoneVoiceWinInput-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PhoneVoiceWinInput-Windows-x64.zip" | Set-Content -Encoding ascii release\SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneVoiceWinInput-Windows-x64
          path: |
            release/PhoneVoiceWinInput-Windows-x64.zip
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          gh release create "${{ github.ref_name }}"
          release/PhoneVoiceWinInput-Windows-x64.zip
          release/SHA256SUMS.txt
          --title "Phone Voice Win Input ${{ github.ref_name }}"
          --generate-notes